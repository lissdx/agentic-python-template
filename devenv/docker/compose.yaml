# The local stack: what has to be running for the project to work on this
# machine. compose.override.yaml sits beside this file and is merged over it —
# development conveniences live there, not here.
#
# Every path below is relative to the REPOSITORY ROOT, not to this directory.
# Compose resolves relative paths and reads .env from the project directory,
# which defaults to the directory of the first -f file — so `make up` passes
# `--project-directory .` and pins it to the root. Run it through the Makefile:
#
#   make up            everything          make up SERVICES=app    only the app
#   make down          stop                make down VOLUMES=1     stop and discard data

name: your-product

services:
  app:
    build:
      # The context is the repository root — that is what has to be copied into
      # the image. The Dockerfile path is relative to the context, not to here.
      context: .
      dockerfile: docker/Dockerfile

