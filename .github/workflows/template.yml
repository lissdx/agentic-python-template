name: Template

# Proves the template's own claim: that `make rename` turns this tree into a
# working project with no template residue left in it. A check nothing triggers
# is documentation, not a gate — so the rename runs here on every change and the
# full pipeline runs on its output, in both of its modes.
#
# `scripts/rename_package.py` deletes this workflow as part of the rename, which
# is why a project generated from the template does not inherit it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rename:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: keep-optional
            args: ""
          - mode: drop-optional
            args: "DROP_OPTIONAL=1"
    name: rename (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Rename the template into a project
        run: make rename NAME=renamed-probe ${{ matrix.args }}

      - name: The renamed project still passes every gate
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest tests/unit
          uv run python scripts/check_notebook_outputs.py

      - name: No template residue is left behind
        run: |
          test -d src/renamed_probe
          test ! -d src/agent_template
          test ! -f scripts/rename_package.py
          test ! -f .github/workflows/template.yml
          test ! -f README.project.md
          ! grep -q "^rename:" Makefile
          ! grep -rq "agent_template" --include="*.py" --include="*.toml" --include="*.md" \
              --exclude-dir=.venv .

      - name: The optional packages went the way the mode asked
        run: |
          if [ "${{ matrix.mode }}" = "drop-optional" ]; then
            test ! -d src/renamed_probe/hitl
            test ! -d src/renamed_probe/memory
          else
            test -d src/renamed_probe/hitl
            test -d src/renamed_probe/memory
          fi
          # The core is never optional, in either mode.
          test -d src/renamed_probe/contracts
          test -d src/renamed_probe/model
