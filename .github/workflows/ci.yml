name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Sync (project + dev groups)
        # --locked fails the build if uv.lock is stale rather than silently resolving.
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        # The gate the four official LangChain agent templates all run as
        # `mypy --strict src/`. A type-checker sitting in dev-dependencies is
        # documentation, not a gate.
        run: uv run mypy

      - name: Pytest (unit)
        run: uv run pytest tests/unit

  image:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: The local stack definition resolves
        # Renders the merged model, which fails if a path in compose.yaml does
        # not resolve — the exact thing that breaks when these files move.
        run: make compose-check

      - name: Build the image
        run: docker build -f docker/Dockerfile -t your-product:ci .

      - name: The image runs
        # A Dockerfile that builds but was never started is an untested artifact.
        run: docker run --rm your-product:ci
