name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Sync (project + dev groups)
        # --locked fails the build if uv.lock is stale rather than silently resolving.
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        # The one gate present in all thirteen repositories surveyed: types fail
        # the build. A type-checker sitting in dev-dependencies is documentation.
        run: uv run mypy

      - name: Pytest (unit)
        run: uv run pytest tests/unit
